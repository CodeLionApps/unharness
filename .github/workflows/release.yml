# Publishes to npm and creates a GitHub Release when a version tag is pushed:
#   npm version 0.2.0 && git push --follow-tags   (or tag vX.Y.Z by hand after bumping package.json)
#
# Publishing uses npm trusted publishing (OIDC), so there is no NPM_TOKEN secret, and npm adds a provenance
# attestation automatically. One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# with owner CodeLionApps, repository unharness and workflow filename release.yml. npm can only configure this for a
# package that already exists, so the very first version (0.1.0) has to be published once by hand
# (npm login && npm publish --access public) or with a token; every later tag then publishes from here.
# package.json "repository.url" must match this GitHub repository exactly, or npm rejects the OIDC publish.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # no shared cache in a job that can publish
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" '/^## \[/ { p = index($0, h) == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2; exit 1; fi
      - name: Make sure npm supports trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: scripts/smoke-pack.sh
      # --ignore-scripts: publish the build that was just smoke-tested instead of rebuilding it in prepack.
      # A version that is already on npm is skipped, so a re-run can still create the GitHub Release.
      - name: Publish to npm
        run: |
          spec="$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}"
          if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm, skipping publish"; exit 0; fi
          npm publish --provenance --access public --ignore-scripts
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
